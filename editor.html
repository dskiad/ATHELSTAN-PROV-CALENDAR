<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23152337'/%3E%3Cpath d='M32 10l8 15 15 2-11 11 3 16-15-8-15 8 3-16L9 27l15-2z' fill='%23b58a48'/%3E%3C/svg%3E"><title>Province Calendar Editor</title><style>
:root{--navy:#152337;--gold:#b58a48;--paper:#f7f0dc;--red:#a81217}*{box-sizing:border-box}body{margin:0;background:#e8dfc9;color:#18202a;font:16px/1.4 Arial,sans-serif}.wrap{max-width:1220px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:4px solid var(--gold);padding-bottom:18px}h1{font:700 clamp(1.55rem,4vw,2.5rem) Georgia,serif;margin:0;color:var(--navy)}.actions{display:flex;flex-wrap:wrap;gap:8px}a,button,label.file{font:700 .9rem Arial,sans-serif;border:1px solid var(--navy);background:white;color:var(--navy);padding:10px 13px;border-radius:5px;text-decoration:none;cursor:pointer}button.primary{background:var(--navy);color:#fff}input[type=file]{display:none}.images{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.image-box{background:var(--paper);border:1px solid #c7b68e;border-radius:8px;padding:15px}.preview{height:180px;margin-bottom:10px;background:#ddd1ae center/contain no-repeat;display:grid;place-items:center;color:#705a36;font:italic 1.1rem Georgia,serif}.rows{background:#fffdf8;border:1px solid #d1c2a0;border-radius:8px;padding:12px;overflow:auto}.row{display:grid;grid-template-columns:180px 1.4fr 1fr 1fr 1.1fr 42px;gap:9px;padding:8px 0;border-bottom:1px solid #ece3d0;min-width:760px}.row:first-child{font-weight:700;color:var(--navy)}select,input{width:100%;padding:8px;border:1px solid #b9aa87;border-radius:4px;background:#fff;font:inherit}.remove{border-color:#a81217;color:#a81217;padding:3px}.hint{color:#655a48;margin:10px 0 18px}.add{margin-top:14px}@media(max-width:650px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.images{grid-template-columns:1fr}.preview{height:140px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Province of Greece — Calendar Editor</h1><div class="hint">Set the two header images and all Court works, then open the Result page.</div></div><nav class="actions"><button class="primary" id="save">Save changes</button><a href="index.html" target="_blank">Open Result page ↗</a></nav></header><section class="images"><div class="image-box"><strong>Left image — Province emblem</strong><div class="preview" id="emblemPreview">No emblem selected</div><label class="file">Upload left image<input id="emblem" type="file" accept="image/*"></label></div><div class="image-box"><strong>Right image — Provincial Grand Master</strong><div class="preview" id="portraitPreview">No portrait selected</div><label class="file">Upload right image<input id="portrait" type="file" accept="image/*"></label></div></section><section class="rows"><div class="row"><span>Month</span><span>Court</span><span>City</span><span>Date</span><span>Meeting type</span><span></span></div><div id="list"></div></section><button class="add" id="add">+ Add work</button></main><script>
const courts=[['Homer No. 194','Athens','English','🇬🇧'],['Northern Paladins No. 198','Thessaloniki','English','🇬🇧'],['Rosa Rhodensis No. 192','Rodos','English','🇬🇧'],['Sectio Aurea No. 125','Piraeus','Greek','🇬🇷'],['Frank Hastings No. 195','Zakynthos','English','🇬🇧'],['Sophia No. 193','Piraeus','Greek','🇬🇷'],['William Cartwright No. 196','Corfu','Greek','🇬🇷']], cities=[...new Set(courts.map(x=>x[1]))],types=['Meeting','Installation','Annual Meeting','Emergency Meeting'];
const seed=[['May 2026','Homer No. 194','Athens','2026-05-08','Meeting'],['May 2026','Northern Paladins No. 198','Thessaloniki','2026-05-09','Installation'],['June 2026','Rosa Rhodensis No. 192','Rodos','2026-06-05','Meeting'],['June 2026','Sectio Aurea No. 125','Piraeus','2026-06-06','Meeting'],['July 2026','Rosa Rhodensis No. 192','Rodos','2026-07-03','Installation'],['September 2026','Rosa Rhodensis No. 192','Rodos','2026-09-04','Meeting'],['September 2026','Homer No. 194','Athens','2026-09-11','Meeting'],['September 2026','Sectio Aurea No. 125','Piraeus','2026-09-12','Meeting'],['September 2026','Frank Hastings No. 195','Zakynthos','2026-09-23','Meeting'],['October 2026','Sophia No. 193','Piraeus','2026-10-01','Meeting'],['November 2026','Sophia No. 193','Piraeus','2026-11-05','Meeting'],['November 2026','Frank Hastings No. 195','Zakynthos','2026-11-11','Meeting'],['November 2026','William Cartwright No. 196','Corfu','2026-11-12','Meeting'],['November 2026','Northern Paladins No. 198','Thessaloniki','2026-11-14','Meeting'],['January 2027','Sophia No. 193','Piraeus','2027-01-07','Installation'],['January 2027','Homer No. 194','Athens','2027-01-08','Meeting'],['January 2027','Sectio Aurea No. 125','Piraeus','2027-01-30','Installation'],['February 2027','Frank Hastings No. 195','Zakynthos','2027-02-10','Installation'],['February 2027','William Cartwright No. 196','Corfu','2027-02-11','Meeting'],['February 2027','Northern Paladins No. 198','Thessaloniki','2027-02-13','Meeting'],['March 2027','William Cartwright No. 196','Corfu','2027-03-11','Installation'],['March 2027','Homer No. 194','Athens','2027-03-12','Installation'],['May 2027','Homer No. 194','Athens','2027-05-14','Meeting'],['May 2027','Northern Paladins No. 198','Thessaloniki','2027-05-15','Meeting']];let data=JSON.parse(localStorage.getItem('provinceSchedule')||'null')||seed;const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');function row(v=['','Homer No. 194','Athens','','Meeting']){let d=document.createElement('div');d.className='row';d.innerHTML=`<input class="month" value="${v[0]}" placeholder="Month, e.g. April 2027"><select class="court">${opt(courts.map(x=>x[0]),v[1])}</select><select class="city">${opt(cities,v[2])}</select><input class="date" type="date" value="${v[3]}"><select class="type">${opt(types,v[4])}</select><button class="remove">×</button>`;d.querySelector('.court').onchange=e=>d.querySelector('.city').value=courts.find(x=>x[0]===e.target.value)[1];d.querySelector('.remove').onclick=()=>d.remove();list.append(d)}data.forEach(row);add.onclick=()=>row();function imageInput(id,key,preview){document.querySelector(id).onchange=e=>{let r=new FileReader;r.onload=()=>{localStorage.setItem(key,r.result);document.querySelector(preview).style.backgroundImage=`url('${r.result}')`;document.querySelector(preview).textContent=''};r.readAsDataURL(e.target.files[0])};let x=localStorage.getItem(key);if(x){document.querySelector(preview).style.backgroundImage=`url('${x}')`;document.querySelector(preview).textContent=''}}imageInput('#emblem','provinceEmblem','#emblemPreview');imageInput('#portrait','provincePortrait','#portraitPreview');save.onclick=()=>{data=[...document.querySelectorAll('#list .row')].map(r=>[...r.querySelectorAll('input,select')].map(x=>x.value));localStorage.setItem('provinceSchedule',JSON.stringify(data));save.textContent='Saved ✓';setTimeout(()=>save.textContent='Save changes',1500)};
</script></body></html>
