<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23152337'/%3E%3Cpath d='M32 10l8 15 15 2-11 11 3 16-15-8-15 8 3-16L9 27l15-2z' fill='%23b58a48'/%3E%3C/svg%3E"><title>Province of Greece — Calendar</title><style>
:root{--ink:#17130f;--red:#b91518;--paper:#ead5a4}*{box-sizing:border-box}body{margin:0;background:#30281e;color:var(--ink);font-family:Arial,sans-serif}.page{max-width:1500px;min-height:100vh;margin:auto;padding:22px;background:radial-gradient(ellipse at 10% 7%,#fff8e4a8,transparent 26%),repeating-linear-gradient(92deg,#734b2011 0 1px,transparent 1px 9px),var(--paper);box-shadow:inset 0 0 90px #54300f5c}.head{display:grid;grid-template-columns:180px 1fr 130px;gap:18px;align-items:center;border-bottom:25px solid #80653b38;padding-bottom:15px}.picture{width:100%;height:180px;background:#c3aa80 center/contain no-repeat;display:grid;place-items:center;border:2px solid #8b633e;color:#62452c;font-style:italic}.emblem{border-radius:48%;background-image:url('assets/province-emblem.jpeg');color:transparent}#portrait{background-image:url('assets/provincial-grand-master.jpg');color:transparent}.title{text-align:center}.title h1,.title h2{font-family:Georgia,serif;margin:0}.title h1{font-size:clamp(1.7rem,4vw,3.5rem)}.title h2{font-size:clamp(1.4rem,3vw,2.8rem);margin-top:8px}.name{font-weight:800;font-style:italic;color:var(--red);font-size:clamp(1.1rem,3vw,2.6rem);margin-top:8px}.calendar{font:italic 700 clamp(1.5rem,3vw,2.8rem) Georgia,serif;margin:10px 0 0}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:20px 0 10px}.bar a{color:#521d19;font-weight:700}.headers,.work{display:grid;grid-template-columns:170px 64px 1.35fr .8fr 1fr 110px .8fr;gap:10px;align-items:center}.headers{font-size:1.2rem;font-weight:800;padding:10px 0;border-bottom:2px solid #7c5c3970}.month{padding:10px 0;border-bottom:1px solid #8e704b75}.work{font-size:clamp(.94rem,1.7vw,1.38rem);font-weight:700;padding:5px 0}.monthLabel{font-size:1.2rem;align-self:start}.flag{font-size:1.7rem;text-align:center}.installation{color:var(--red)}@media(max-width:720px){.page{padding:12px}.head{grid-template-columns:68px 1fr 58px;gap:7px;border-bottom-width:12px}.picture{height:94px}.title h2{margin-top:3px}.bar{font-size:.9rem}.headers{display:none}.month{padding:8px 0}.work{grid-template-columns:1fr 42px 1.35fr;gap:4px;padding:9px 0}.monthLabel{grid-column:1/-1;font-size:1.1rem}.flag{font-size:1.35rem}.city{grid-column:3}.date{grid-column:1/3}.day{grid-column:3}.type{grid-column:1/-1;padding-left:46px}.work:first-child .monthLabel{display:block}}
</style></head><body><main class="page"><header class="head"><div class="picture emblem" id="emblem">Province emblem</div><div class="title"><h1>PROVINCE OF GREECE</h1><h2>PROV. GRAND MASTER</h2><div class="name">RW. Bro. Ioannis Benetatos, KCAG</div><div class="calendar">calendar</div></div><div class="picture" id="portrait">Portrait</div></header><div class="bar"><strong>Works of the Court</strong><a href="editor.html">Edit calendar</a></div><div class="headers"><span>Month</span><span>Language</span><span style="transform:translateX(10px)">Court</span><span>City</span><span>Date</span><span>Day</span><span>Meeting Type</span></div><div id="months"></div></main><script>
const courts=[['Homer No. 194','Athens','English','🇬🇧'],['Northern Paladins No. 198','Thessaloniki','English','🇬🇧'],['Rosa Rhodensis No. 192','Rodos','English','🇬🇧'],['Sectio Aurea No. 125','Piraeus','Greek','🇬🇷'],['Frank Hastings No. 195','Zakynthos','English','🇬🇧'],['Sophia No. 193','Piraeus','Greek','🇬🇷'],['William Cartwright No. 196','Corfu','Greek','🇬🇷']];const data=JSON.parse(localStorage.getItem('provinceSchedule')||'[]');const seed=[['May 2026','Homer No. 194','Athens','2026-05-08','Meeting'],['May 2026','Northern Paladins No. 198','Thessaloniki','2026-05-09','Installation'],['June 2026','Rosa Rhodensis No. 192','Rodos','2026-06-05','Meeting'],['June 2026','Sectio Aurea No. 125','Piraeus','2026-06-06','Meeting'],['July 2026','Rosa Rhodensis No. 192','Rodos','2026-07-03','Installation'],['September 2026','Rosa Rhodensis No. 192','Rodos','2026-09-04','Meeting'],['September 2026','Homer No. 194','Athens','2026-09-11','Meeting'],['September 2026','Sectio Aurea No. 125','Piraeus','2026-09-12','Meeting'],['September 2026','Frank Hastings No. 195','Zakynthos','2026-09-23','Meeting'],['October 2026','Sophia No. 193','Piraeus','2026-10-01','Meeting'],['November 2026','Sophia No. 193','Piraeus','2026-11-05','Meeting'],['November 2026','Frank Hastings No. 195','Zakynthos','2026-11-11','Meeting'],['November 2026','William Cartwright No. 196','Corfu','2026-11-12','Meeting'],['November 2026','Northern Paladins No. 198','Thessaloniki','2026-11-14','Meeting'],['January 2027','Sophia No. 193','Piraeus','2027-01-07','Installation'],['January 2027','Homer No. 194','Athens','2027-01-08','Meeting'],['January 2027','Sectio Aurea No. 125','Piraeus','2027-01-30','Installation'],['February 2027','Frank Hastings No. 195','Zakynthos','2027-02-10','Installation'],['February 2027','William Cartwright No. 196','Corfu','2027-02-11','Meeting'],['February 2027','Northern Paladins No. 198','Thessaloniki','2027-02-13','Meeting'],['March 2027','William Cartwright No. 196','Corfu','2027-03-11','Installation'],['March 2027','Homer No. 194','Athens','2027-03-12','Installation'],['May 2027','Homer No. 194','Athens','2027-05-14','Meeting'],['May 2027','Northern Paladins No. 198','Thessaloniki','2027-05-15','Meeting']];let all=data.length?data:seed;let groups={};all.forEach(x=>(groups[x[0]]??=[]).push(x));for(const [month,works] of Object.entries(groups)){let s=document.createElement('section');s.className='month';works.forEach((x,i)=>{let c=courts.find(q=>q[0]===x[1])||courts[0],date=new Date(x[3]+'T12:00'),r=document.createElement('div');r.className='work '+(x[4]==='Installation'?'installation':'');r.innerHTML=`<div class="monthLabel">${i?'' : month}</div><div class="flag" title="${c[2]}">${c[3]}</div><div>${x[1]}</div><div class="city">${x[2]}</div><div class="date">${date.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div><div class="day">${date.toLocaleDateString('en-GB',{weekday:'long'})}</div><div class="type">${x[4]}</div>`;s.append(r)});months.append(s)}for(const [key,id] of [['provinceEmblem','emblem'],['provincePortrait','portrait']]){let x=localStorage.getItem(key);if(x){document.getElementById(id).style.backgroundImage=`url('${x}')`;document.getElementById(id).textContent=''}}
</script></body></html>
