<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23152337'/%3E%3Cpath d='M32 10l8 15 15 2-11 11 3 16-15-8-15 8 3-16L9 27l15-2z' fill='%23b58a48'/%3E%3C/svg%3E"><title>Province of Greece — Calendar</title><style>
:root{--ink:#17130f;--red:#b91518;--paper:#ead5a4}
*{box-sizing:border-box}html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:#30281e;color:var(--ink);font-family:Arial,sans-serif}
.page{width:100%;max-width:94rem;min-height:100vh;margin:auto;padding:clamp(.75rem,2vw,1.5rem);background:radial-gradient(ellipse at 10% 7%,#fff8e4a8,transparent 26%),repeating-linear-gradient(92deg,#734b2011 0 1px,transparent 1px 9px),var(--paper)}
.head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,5fr) minmax(0,1fr);gap:clamp(.5rem,2vw,1.5rem);align-items:center;border-bottom:.6rem solid #80653b38;padding-bottom:.8rem}
.picture{width:100%;max-width:13.5rem;aspect-ratio:1;background:transparent center/contain no-repeat;justify-self:center;color:transparent}
.emblem{border-radius:50%;background-image:url('assets/province-emblem.jpeg')}
#portrait{max-width:8.125rem;aspect-ratio:1304/1920;background-image:url('assets/provincial-grand-master.jpg')}
.title{text-align:center;min-width:0}.title h1,.title h2{font-family:Georgia,serif;margin:0}
.title h1{font-size:clamp(1.05rem,3.6vw,3.5rem)}.title h2{font-size:clamp(.95rem,2.8vw,2.8rem);margin-top:.3rem}
.name{font-weight:800;font-style:italic;color:var(--red);font-size:clamp(.95rem,2.3vw,2.6rem);margin-top:.35rem}
.calendar{font:italic 700 clamp(1.2rem,2.8vw,2.8rem) Georgia,serif;margin-top:.4rem}
.finder{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.75rem;padding:1rem 0;font:900 clamp(1rem,2vw,1.25rem) Georgia,serif}
.finder label{color:var(--red);min-width:0}.finder label span{display:block;font:inherit;margin-top:.2rem}
.finder select{width:min(100%,28rem);min-width:0;min-height:2.75rem;padding:.65rem 2rem .65rem .6rem;border:1px solid #8b633e;border-radius:.3rem;background:#fff9e9;font:600 1rem Arial,sans-serif}
select:focus-visible{outline:3px solid #8c241a;outline-offset:3px}
.bar{padding:.5rem 0;font-size:1rem}
.headers,.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.65fr) minmax(0,1.65fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.85fr) minmax(0,1fr);gap:clamp(.35rem,1vw,.9rem);align-items:center}
.headers{font-size:1rem;font-weight:800;padding:.8rem 0;border-bottom:2px solid #7c5c3970}
.work{font-size:clamp(1rem,1.3vw,1.25rem);font-weight:700;padding:.65rem 0;line-height:1.4}
.headers>*,.work>*{min-width:0;overflow-wrap:anywhere}
.month{padding:.4rem 0;border-bottom:1px solid #8e704b75}
.monthLabel{align-self:start}.flag{font-size:1.7rem;text-align:center}.installation{color:var(--red)}
#months{min-height:50vh}
@media(min-width:768px) and (max-width:1024px){.work{font-size:1rem;padding:.8rem 0}.headers{font-size:.875rem}.head{gap:.75rem}}
@media(max-width:767px){
.finder{flex-direction:column;align-items:stretch;gap:.5rem}.finder select{width:100%}.headers{display:none}
.work{grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr);gap:.3rem .6rem;margin:.6rem 0;padding:.75rem;background:#fff9e94d;border:1px solid #8e704b60;border-radius:.4rem}
.monthLabel{grid-column:1/-1;font-family:Georgia,serif;font-size:1.1rem}.monthLabel:empty{display:none}
.flag{grid-column:1;grid-row:2;font-size:1.4rem}.work>:nth-child(3){grid-column:2/-1;grid-row:2}
.city{grid-column:2/-1}.date{grid-column:2/-1}.day{grid-column:2}.type{grid-column:3;text-align:right}
}
@media(max-width:480px){.head{grid-template-columns:minmax(0,1fr) minmax(0,3.8fr) minmax(0,.8fr);gap:.4rem}.title h1{font-size:1.05rem}.title h2{font-size:.95rem}.name{font-size:.95rem}.finder{font-size:1rem}.work{font-size:1rem}}
@media(min-width:481px) and (max-width:767px){.head{grid-template-columns:minmax(0,1fr) minmax(0,4fr) minmax(0,.85fr)}.work{padding:1rem}}
@media(prefers-reduced-motion:no-preference){select{transition:background-color .15s ease}}
@media print{.finder{display:none}.page{max-width:none}.work{break-inside:avoid}}
</style></head><body><main class="page"><header class="head"><div class="picture emblem" id="emblem">Province emblem</div><div class="title"><h1>PROVINCE OF GREECE</h1><h2>PROV. GRAND MASTER</h2><div class="name">RW. Bro. Ioannis Benetatos, KCAG</div><div class="calendar">calendar</div></div><div class="picture" id="portrait">Portrait</div></header><section class="finder"><label for="courtFilter">Βρες ημερομηνίες της Αυλής σου:<span>Find the dates of your Court:</span></label><select id="courtFilter"><option value="">Όλες οι Αυλές</option></select></section><div class="bar"><strong>Works of the Court</strong></div><div class="headers"><span>Month</span><span>Language</span><span>Court</span><span>City</span><span>Date</span><span>Day</span><span>Meeting Type</span></div><div id="months"></div></main><script>
(async()=>{try {
const response=await fetch("calendar-data.js?updated="+Date.now(),{cache:"no-store"});
if(!response.ok)throw new Error("Calendar download failed");
const raw=await response.text();
const match=raw.match(/^\s*window\.PROVINCE_SCHEDULE\s*=\s*([\s\S]*?)\s*;?\s*$/);
if(!match)throw new Error("Invalid calendar format");
const published=JSON.parse(match[1]);
if(!Array.isArray(published))throw new Error("No published programme");
const courts=[['Homer No. 194','Athens','English','🇬🇧'],['Northern Paladins No. 198','Thessaloniki','English','🇬🇧'],['Rosa Rhodensis No. 192','Rodos','English','🇬🇧'],['Sectio Aurea No. 125','Piraeus','Greek','🇬🇷'],['Frank Hastings No. 195','Zakynthos','English','🇬🇧'],['Sophia No. 193','Piraeus','Greek','🇬🇷'],['William Cartwright No. 196','Corfu','Greek','🇬🇷']];const all=published;let groups={};all.forEach(x=>(groups[x[0]]??=[]).push(x));for(const [month,works] of Object.entries(groups)){let s=document.createElement('section');s.className='month';s.dataset.month=month;works.forEach((x,i)=>{let c=courts.find(q=>q[0]===x[1])||courts[0],date=new Date(x[3]+'T12:00'),r=document.createElement('div');r.dataset.month=date.toLocaleDateString('en-GB',{month:'long',year:'numeric'});r.className='work '+(x[4]==='Installation'?'installation':'');r.innerHTML=`<div class="monthLabel">${i?'' : month}</div><div class="flag" title="${c[2]}">${c[3]}</div><div>${x[1]}</div><div class="city">${x[2]}</div><div class="date">${date.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div><div class="day">${date.toLocaleDateString('en-GB',{weekday:'long'})}</div><div class="type">${x[4]}</div>`;s.append(r)});months.append(s)}const picker=document.querySelector("#courtFilter");courts.forEach(c=>picker.add(new Option(c[0]+" — "+c[1],c[0])));picker.onchange=()=>document.querySelectorAll(".month").forEach(m=>{let any=false;m.querySelectorAll(".work").forEach(w=>{let visible=!picker.value||w.children[2].textContent===picker.value;w.style.display=visible?"grid":"none";any||=visible});m.style.display=any?"block":"none"});picker.addEventListener("change",()=>document.querySelectorAll(".month").forEach(m=>{let first=true;m.querySelectorAll(".work").forEach(w=>{if(w.style.display!=="none"){w.children[0].textContent=picker.value?w.dataset.month:(first?m.dataset.month:"");first=false}})}));
} catch(error) {
 const area=document.getElementById("months");
 area.textContent="The published calendar could not be loaded. Please reload this page.";
 area.setAttribute("role","alert");
}
})();
</script></body></html>
